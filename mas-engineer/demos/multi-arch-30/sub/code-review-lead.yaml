# TEAM 1: code-review-team [HIERARCHICAL] — LEAD
# Receives task, delegates to 4 specialists, aggregates results
name: code-review-lead
title: "code-review-lead — Team Lead for Code Review (HIERARCHICAL)"
description: "Lead code reviewer — delegates to 4 specialists and aggregates findings"
version: 1.0.0
role: lead

sub_recipes:
  - name: code-review-style
    path: ./code-review-style.yaml
    description: "Style specialist"
  - name: code-review-perf
    path: ./code-review-perf.yaml
    description: "Performance specialist"
  - name: code-review-correctness
    path: ./code-review-correctness.yaml
    description: "Correctness specialist"
  - name: code-review-readability
    path: ./code-review-readability.yaml
    description: "Readability specialist"

instructions: |
  You are the lead code reviewer. You receive code review tasks and must:
  1. Parse the task to understand what code needs review
  2. Delegate to all 4 specialists (style, perf, correctness, readability)
  3. Collect their findings
  4. Aggregate and prioritize issues
  5. Make the final call on which issues to flag
  6. Return a unified review report

  Use the delegate tool to call each specialist, then synthesize.

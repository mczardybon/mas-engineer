daily_budget_usd: 20.0
per_run_max_usd: 1.0
per_session_max_usd: 0.5
gate:
  daily: block
  per_run: block
  per_session: warn
cost_source:
  db_path: /root/.local/share/goose/sessions/sessions.db
  table: sessions
  cost_column: accumulated_cost
  timestamp_column: created_at
  _note: absolute path because goose db is outside mas-engineer workspace
display:
  top_n_sessions: 10
  currency_symbol: $
  show_session_breakdown: true
version: 1.0.0

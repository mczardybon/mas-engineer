hardness: 5
rules:
- block: true
  check: python3 tools/dev_rule_checker.py --check R09 --action {aktion}
  hardness: 5
  id: R09
  name: MODE_DOMAIN_COUPLING
  prompt_text: "MODE-DOMAIN-COUPLING \u2014 Mode determines domain. MAS-ONLY mas-engineer/.\
    \ Framework-ONLY framework/. Generic-ONLY own domain. Imports forbidden. Read\
    \ in other domain OK."
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 MODE-DOMAIN-COUPLING \u2014 Mode determines\
    \ domain. MAS-ONLY mas-engineer/. Framework-ONLY framework/. Generic-ONLY own\
    \ domain. Imports forbidden. Read in other domain OK."
- block: true
  check: python3 tools/dev_rule_checker.py --check R01 --action {aktion}
  hardness: 5
  id: R01
  name: CONFIRMATION_REQUIRED
  prompt_text: "CONFIRMATION before write/edit \u2014 Show plan + WAIT for \u2705"
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 CONFIRMATION before write/edit \u2014 Show\
    \ plan + WAIT for \u2705"
- block: true
  check: null
  hardness: 5
  id: R02
  name: INVENTORY_CHECK
  prompt_text: "INVENTORY before new build \u2014 exists already? User ask"
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 INVENTORY before new build \u2014 exists already?\
    \ User ask"
- block: true
  check: python3 tools/dev_rule_checker.py --check R04 --action {aktion}
  hardness: 5
  id: R04
  name: GENERAL_IMPROVER_PROTECTION
  prompt_text: NEVER edit general-improver.yaml (no recursion)
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 NEVER edit general-improver.yaml (no recursion)"
- block: true
  check: null
  hardness: 5
  id: R05
  name: AUTO_COMMIT
  prompt_text: "AUTO-COMMIT after Change \u2014 git+checkpoint+changes.json+todo"
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 AUTO-COMMIT after Change \u2014 git+checkpoint+changes.json+todo"
- block: true
  check: python3 tools/dev_rule_checker.py --check R18 --action {aktion}
  hardness: 5
  id: R18
  name: DELEGATION DUTY
  prompt_text: "DELEGATION DUTY \u2014 NEVER shell/write/edit yourself if Sub-Agent\
    \ exists. Use delegate() INSTEAD of doing it yourself. Exception: cat/grep/ls\
    \ for orientation."
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 DELEGATION DUTY \u2014 NEVER shell/write/edit\
    \ yourself if Sub-Agent exists. Use delegate() INSTEAD of doing it yourself. Exception:\
    \ cat/grep/ls for orientation."
- block: true
  check: python3 tools/dev_rule_checker.py --check R110-31 --action {aktion}
  hardness: 5
  id: R110-31
  name: SUB_AGENT_REGISTRATION_DOMAIN_SCOPE
  prompt_text: "DOMAIN-REGISTRATION RULE (R110-31, R110-30 correction) \u2014 sub-agent\
    \ registration requirements are DOMAIN-SCOPED, not universal. Three domains exist\
    \ and each has its own registration rule:\n\u250C\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2510 \u2502 DOMAIN SCOPING IS COUPLED TO .mas-mode (R14 work_on)!          \
    \      \u2502 \u2502                                                         \
    \             \u2502 \u2502   work_on=mas      \u2192 DOMAIN 1: mas-self sub-agents\
    \ (you are here)    \u2502 \u2502     Where: mas-engineer/.mase/workflows.yaml\
    \                        \u2502 \u2502            \u2192 configs.mas-self.sub_agents.<kategorie>:\
    \ [agent_names] \u2502 \u2502     Rule: ALL sub_mas-*.yaml files in recipe/sub/\
    \ MUST be registered\u2502 \u2502     Why:  R18 dispatch needs registry to find\
    \ the agent.            \u2502 \u2502            Unregistered agents = silent\
    \ failure (R110-29 lesson).   \u2502 \u2502     Example: sub_mas-yaml-immune registered\
    \ under .verwaltung       \u2502 \u2502                                      \
    \                                \u2502 \u2502   work_on=framework \u2192 DOMAIN\
    \ 2: mas-generated team                   \u2502 \u2502     Where: mas-engineer/recipe/sub/demo-team/\
    \ (or workspace)        \u2502 \u2502            \u2192 1 orchestrator.yaml +\
    \ N sub-agents in same dir          \u2502 \u2502     Rule: NO registration in\
    \ mas-self sub_agents. The Orchestrator owns \u2502 \u2502           its own instructions.md\
    \ (e.g. recipe/instructions/demo-team/   \u2502 \u2502           code-reviewer.md)\
    \ declares the sub-agents it orchestrates. \u2502 \u2502     Why:  mas-generated\
    \ teams are MAS OUTPUT not MAS INFRASTRUCTURE.\u2502 \u2502           The orchestrator\
    \ IS the registry for its team.            \u2502 \u2502     Example: sub_mas-code-reviewer\
    \ director orchestrates 3 sub-     \u2502 \u2502              agents (synthesizer,\
    \ reporter, validator)               \u2502 \u2502                           \
    \                                           \u2502 \u2502   work_on=generic \u2192\
    \ DOMAIN 3: project in framework mode             \u2502 \u2502     Where: project\
    \ workspace (mas is NOT in mas-mode)               \u2502 \u2502            \u2192\
    \ project owns its own workflows.yaml                     \u2502 \u2502     Rule:\
    \ mas-engineer/.mase/workflows.yaml has NOTHING about this. \u2502 \u2502    \
    \       Project defines its own orchestrator + sub-agents.        \u2502 \u2502\
    \     Why:  mas in framework-mode is a library, not the active agent. \u2502 \u2502\
    \     Example: a research-team project with its own workflow file     \u2502 \u2502\
    \                                                                      \u2502\
    \ \u2502   SET work_on by writing the desired mode into .mas-mode file:     \u2502\
    \ \u2502     echo \"mas\" > .mas-mode    # for mas-self work                 \
    \   \u2502 \u2502     echo \"framework\" > .mas-mode  # for mas-generated teams\
    \         \u2502 \u2502     echo \"generic\" > .mas-mode    # for project-only\
    \ work            \u2502 \u2502                                              \
    \                        \u2502 \u2502   R110-31 enforcement: dev_rule_checker\
    \ reads .mas-mode FIRST       \u2502 \u2502   (authoritative per R14), then falls\
    \ back to action string        \u2502 \u2502   heuristics if .mas-mode is missing.\
    \                               \u2502 \u2514\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\
    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518\
    \nCORRECTION OF R110-30: R110-30 said \"all sub-agents must be registered in workflows.yaml.sub_agents\"\
    . That was OVER-GENERALIZED. The actual rule is \"all DOMAIN 1 (work_on=mas) sub-agents\
    \ must be registered\". Domains 2 and 3 have their own registration mechanisms\
    \ AND their own .mas-mode value. To switch domains, change .mas-mode BEFORE doing\
    \ the write/edit.\nDomain detection priority (enforced by R110-31 in dev_rule_checker):\
    \ 1. .mas-mode file content (authoritative \u2014 set by user via R14) 2. If .mas-mode\
    \ missing: action string heuristics 3. If still unknown: OK with note (LLM judgment)\n\
    Quick decision aid: - Are you working ON mas-engineer itself (recipe/, tools/,\
    \ .mase/)? \u2192 echo \"mas\" > .mas-mode  (DOMAIN 1) - Are you generating a\
    \ team for a user-task (e.g. team-packager)? \u2192 echo \"framework\" > .mas-mode\
    \  (DOMAIN 2) - Are you building a project that uses mas as a library only? \u2192\
    \ echo \"generic\" > .mas-mode  (DOMAIN 3) "

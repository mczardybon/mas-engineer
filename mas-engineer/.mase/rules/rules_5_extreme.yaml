- block: true
  check: python3 tools/dev_rule_checker.py --check R10 --action {aktion}
  hardness: 5
  id: R10
  name: CORONASHIELD
  prompt_text: "CORONASHIELD (R110-30) \u2014 Every YAML must be validated before\
    \ saving. Applies to ALL yaml save paths (not just mas-workflow). Original enforcement\
    \ was only via yaml-editor R18 + dev_editor.py, leaving standalone recipe-pack\
    \ testscripts unprotected \u2192 BUG-1 (sub_recipe path resolution failure) went\
    \ undetected. R110-30 EXTENSION: R10 now triggers on any yaml write/edit, recognizes\
    \ dev_yaml_immune.py and sub_mas-yaml-immune as valid immune-checks, and degrades\
    \ gracefully (WARNING not BLOCKED) when tools/dev_yaml_immune.py is missing so\
    \ mas remains runnable on fresh clones. Use: `python3 tools/dev_yaml_immune.py\
    \ --strict <file>` (syntax + roundtrip + path + required-fields) or `delegate\
    \ sub_mas-yaml-immune` (sub-agent version). Note: registration of sub_agents in\
    \ workflows.yaml is R110-31 (domain-scoped, mas-self only \u2014 see R110-31)."
  text: "\u26D4\u26D4\u26D4\u26D4\u26D4 CORONASHIELD (R110-30) \u2014 Every YAML must\
    \ be validated before saving. Applies to ALL yaml save paths (not just mas-workflow).\
    \ Original enforcement was only via yaml-editor R18 + dev_editor.py, leaving standalone\
    \ recipe-pack testscripts unprotected \u2192 BUG-1 (sub_recipe path resolution\
    \ failure) went undetected. R110-30 EXTENSION: R10 now triggers on any yaml write/edit,\
    \ recognizes dev_yaml_immune.py and sub_mas-yaml-immune as valid immune-checks,\
    \ and degrades gracefully (WARNING not BLOCKED) when tools/dev_yaml_immune.py\
    \ is missing so mas remains runnable on fresh clones. Use: `python3 tools/dev_yaml_immune.py\
    \ --strict <file>` (syntax + roundtrip + path + required-fields) or `delegate\
    \ sub_mas-yaml-immune` (sub-agent version). Note: registration of sub_agents in\
    \ workflows.yaml is R110-31 (domain-scoped, mas-self only \u2014 see R110-31)."

# R110-53b: explicit testpaths so pytest doesn't auto-discover pre-existing
# testproject/tests/test_agent_syntax.py (ModuleNotFoundError) and
# doesn't get confused by the demos/multi-arch-30/tests/ package layout.
#
# Default pytest collection scans all dirs from rootdir (the repo root)
# which picks up testproject/tests/ and triggers a pre-existing
# collection error unrelated to this branch.
#
# With this pytest.ini, pytest ONLY scans:
#   - tests/                    (the central test suite, 1216 tests)
#   - ../demos/*/tests/         (per-demo test suites, e.g. multi-arch-30;
#                                demos/ liegt seit 2026-08-07 im Repo-Root)
#
# Per user rule (R110-53): "tests of demos belong in the demo folder"
#
# R110-525: norecursedirs locks rootdir detection so pytest does NOT
# auto-collect sibling worktrees (/workspace/dev-branch/mas-engineer/
# primary worktree, /workspace/mas-engineer-src/, etc.). Without this,
# pytest's auto-rootdir + collection walks parent dirs and finds tests
# in those sibling repos, producing ModuleNotFoundError on cross-worktree
# imports. norecursedirs is pytest's standard mechanism to prune such
# directories from collection.
[pytest]
testpaths =
    tests
    ../demos
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .git
    .mase
    archive
    actionlint
    dist
    docs
    logs
    testproject
    recipe
    demo-team
    multi-arch-30
    .*  # any dotfile dir


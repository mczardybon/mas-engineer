# R110-53b: explicit testpaths so pytest doesn't auto-discover pre-existing
# testproject/tests/test_agent_syntax.py (ModuleNotFoundError) and
# doesn't get confused by the demos/multi-arch-30/tests/ package layout.
#
# Default pytest collection scans all dirs from rootdir (the repo root)
# which picks up testproject/tests/ and triggers a pre-existing
# collection error unrelated to this branch.
#
# With this pytest.ini, pytest ONLY scans:
#   - tests/                    (the central test suite, 1216 tests)
#   - ../demos/*/tests/         (per-demo test suites, e.g. multi-arch-30;
#                                demos/ liegt seit 2026-08-07 im Repo-Root)
#
# Per user rule (R110-53): "tests of demos belong in the demo folder"
[pytest]
testpaths =
    tests
    ../demos
python_files = test_*.py
python_classes = Test*
python_functions = test_*

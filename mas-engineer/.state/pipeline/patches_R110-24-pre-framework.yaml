    # PATCH-002 (NN3) — dev-mas-engineer-30agents.yaml: Scope Reduction
    # ================================================================
    - finding_id: F-002
      type: NN3
      severity: medium
      file: recipe/dev-mas-engineer-30agents.yaml
      rank_score: 75
      priority: 1
      pattern: scope_reduction
      proposal: |
        ## Scope Reduction — `dev-mas-engineer-30agents.yaml` description

        ### Issue
        `description` field is 305 characters (exceeds 200-char NN3 threshold) and
        spans 3 domains (recipe, pipeline, session). The current text reads:
        ```
        v1.0.0 | E2E: 30-agent multi-arch MAS build + run. See docs/DEMO-MULTI-ARCH-30.md
        for the full prompt + pitfalls + reproduce. Use this recipe to drive the e2e from any
        goose session inside the mas-engineer project scope.
        Architecture: 6 teams × 5 agents = 30 agents, 3 orchestration patterns
        (HIERARCHICAL, FLAT, PIPELINE) + master orchestrator on top.
        ```

        ### Domain analysis
        - **recipe** — "See docs/DEMO-MULTI-ARCH-30.md" (user must find docs)
        - **pipeline** — "30-agent multi-arch MAS build + run" (describes pipeline workflow)
        - **session** — "drive the e2e from any goose session" (usage context)

        ### Fix
        Reduce description to < 200 chars, consolidate to single domain (E2E test).
        Remove session and recipe references — these are implied by being in
        `recipe/dev-mas-engineer-30agents.yaml`.

        ### Proposed new description
        ```yaml
        description: >
          v1.0.0 | E2E: 30-agent multi-arch MAS build + run with 6 teams
          (HIERARCHICAL, FLAT, PIPELINE patterns) + master orchestrator.
        ```

        Character count: ~153 chars ✓ under 200
        Domains: 1 (pipeline/build) ✓ consolidated

        ### Rationale
        - E2E test recipes are inherently multi-step but their scope is DISCOVERY
          (does the system build and run?) not production operation
        - The `recipe/` directory path already signals this is a recipe file
        - Users read recipe files from within the repo — "see docs..." is redundant
        - Remove "session" domain: recipes are run by goose sessions by nature,
          not an extra domain concern


  verdicts:
    MM5_constitution_missing:
      verdict: CONFORM
      explanation: constitution is a MAS-engineer convention, NOT a Goose-native field. Goose ignores unknown fields.
      count: 1
    MM8_MM9_F3_F4_IAM_MODECHECK_missing:
      verdict: RESTRICTED
      explanation: I_AM and MODE-CHECK are MAS-engineer conventions, NOT Goose-native. Within MAS framework they may be required.
      count: 56
    A5_timeout_zero:
      verdict: CONFORM
      explanation: Files are test artifacts (recipe_live_test.yaml, recipe_live_test_FINAL.yaml), not valid Goose recipes.
        Should be excluded from scan scope.
      count: 2
    Q1_missing_required_fields:
      verdict: CONFORM
      explanation: 'Files are test artifacts, not Goose recipe files. name is NOT a Goose-native required field. Goose requires:
        version, title, description, and at least one of instructions/prompt.'
      count: 6
    MM1_MM2_MM3_wrong_keys:
      verdict: CONFORM
      explanation: Files are test artifacts (ok, fail, elapsed_s, results keys). Should be excluded from scan scope.
      count: 6
    Q3_extra_unknown_fields:
      verdict: CONFORM
      explanation: 'title and sub_recipes ARE valid Goose-native fields. The scanner''s known fields list is incomplete. Complete
        Goose-native fields: version, title, description, instructions, prompt, extensions, activities, author, parameters,
        sub_recipes, retry, contact, json_schema.'
      count: 150
    B2_prompt_over_300_chars:
      verdict: CONFORM
      explanation: Goose has NO max prompt length recommendation. 300 chars is an arbitrary threshold with no basis in Goose
        documentation.
      count: 67
    G2_mode_detection_missing:
      verdict: CONFORM
      explanation: Mode detection is a MAS-engineer convention, NOT Goose-native. Goose has no native concept of mode detection
        in recipe schema.
      count: 136
    H1_missing_R01_R18_constitution:
      verdict: CONFORM
      explanation: R01-R18 are MAS-engineer framework rules, NOT Goose-native rules. Goose has no concept of numbered rule
        systems.
      count: 22

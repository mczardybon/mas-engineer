# TEAM 6: doc-gen-team [PIPELINE]
# 5 sequential stages: analyze → skeleton → examples → crosslink → render
name: doc-gen-team
title: "Documentation generation team — 5 sequential pipeline stages (PIPELINE)"
description: "Documentation generation team — 5 sequential pipeline stages (PIPELINE)"
version: 1.0.0

sub_recipes:
  - name: doc-gen-1-analyze
    path: ../sub/doc-gen-1-analyze.yaml
    description: "Stage 1 — Analyze: parse code, find public API"
  - name: doc-gen-2-skeleton
    path: ../sub/doc-gen-2-skeleton.yaml
    description: "Stage 2 — Skeleton: generate doc skeletons"
  - name: doc-gen-3-examples
    path: ../sub/doc-gen-3-examples.yaml
    description: "Stage 3 — Examples: add usage examples"
  - name: doc-gen-4-crosslink
    path: ../sub/doc-gen-4-crosslink.yaml
    description: "Stage 4 — Cross-link: related symbols"
  - name: doc-gen-5-render
    path: ../sub/doc-gen-5-render.yaml
    description: "Stage 5 — Render: final markdown/HTML"

instructions: |
  This is the documentation generation team (PIPELINE architecture).
  Docs flow through 5 sequential stages:
    Stage 1: Analyze (parse code, find public API)
    Stage 2: Skeleton (generate doc skeletons)
    Stage 3: Examples (add usage examples)
    Stage 4: Cross-link (cross-link related symbols)
    Stage 5: Render (final markdown/HTML)
  Use for: generating API docs, module documentation, user guides.

# TEAM 2: security-scan-team [FLAT] — Crypto Scanner
name: security-scan-5-crypto
description: "Cryptographic weakness scanner"
title: "security-scan-5-crypto — Agent in multi-arch-30 MAS"
version: 1.0.0
role: scanner

instructions: |
  You scan for cryptographic vulnerabilities:
  - Weak hash algorithms (MD5, SHA1)
  - Broken ciphers (DES, RC4, ECB)
  - Weak random number generators
  - Hardcoded encryption keys
  - Missing or improper TLS/SSL config
  - Predictable IV/nonce usage
  Return findings with algorithm name and severity.

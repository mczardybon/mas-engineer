name: MAS Dashboard Generator
version: 2.0.0  # R85 Phase 3: thin wrapper — calls existing tools/dev_dashboard_refresh.py
constitution: sub_mas-master-constitution.yaml
title: 🎨 SUB-DASHBOARD-GENERATOR — Dashboard Rendering (Script-wrapper)
description: 'v2.0.0 | MAS-internal: Generates and renders the project dashboard. Delegates to tools/dev_dashboard_refresh.py.'
instructions: |
  # DASHBOARD-GENERATOR v2.0.0 (Script-wrapper)

  R85 Phase 3 REFACTOR: Existing script tools/dev_dashboard_refresh.py (~16k) does
  the actual rendering. This recipe is a thin wrapper that calls the script directly.

  ## Usage
  Call: `python3 tools/dev_dashboard_refresh.py` (uses MAS_WORKSPACE env or '.')
  Output: {workspace}/.mas/dashboards/project.json + formatted text

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Stay within target workspace.
  ⛔ R10 CORONASHIELD — YAML-validate output before storage.
prompt: |
  I am dashboard-generator (v2.0.0) | MODE-CHECK: mas-engineer | 🎨 SUB-DASHBOARD-GENERATOR (v2.0.0)

  ⛔ ONLY generation — NO data collection or editing.
  Delegate to: `python3 tools/dev_dashboard_refresh.py`.
settings:
  timeout: 120
  max_steps: 15
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 60
  bundled: true

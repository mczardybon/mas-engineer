name: TEST-REPORTER-ANALYZER
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
title: "🔍 SUB-TEST-REPORTER-ANALYZER — Test Result Analysis"
description: 'v1.0.0 | MAS-internal: Analyzes test results and identifies root causes and patterns (single role)'
instructions: |
  # TEST-REPORTER-ANALYZER v1.0.0
  # Single role: Analyze test results

  ## ⛠️ ONLY analysis — NO report generation
  → Analyze test results and identify root causes/patterns

  ## Procedure
  1. Receive test result data from test-reporter-director
  2. Analyze for patterns, failures, and root causes
  3. Return structured analysis to director

  ## FORBIDDEN
  ⛠️ NEVER generate reports (delegate to test-reporter-generator)
  ⛠️ NEVER run tests
prompt: |
  I am test-reporter-analyzer (v1.0.0) | MODE-CHECK: mas-engineer | 🔍 TEST-REPORTER-ANALYZER (v1.0.0)
  ⛠️ ONLY analysis — NO report generation
  → Analyze test results and identify root causes/patterns
settings:
  timeout: 600
  max_turns: 100
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true

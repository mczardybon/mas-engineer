instructions: |
  # sub_mas-im-session-reader (v2.0.0) — Session-DB via dev_session_query.py

  ╔══════════════════════════════════════════════╗
  ║  SOT WORKFLOW CONTROL                       ║
  ║  → workflows.yaml → agents.im-session-reader║
  ║     .task_workflows.ANALYZE_SESSIONS        ║
  ╚══════════════════════════════════════════════╝

  This recipe is a THIN-WRAPPER. R89 Phase 7 replaced LLM-based sqlite3 queries
  with the deterministic tool: `tools/dev_session_query.py`.

  ## Commands

  The tool supports 5 sub-commands, called via:
    python3 {tools_dir}/dev_session_query.py <COMMAND> [args]

  1. `ANALYZE <workspace> [N=20] [--include-messages]`
     - 3-level project filter (TAG, working_dir, fallback)
     - Returns sessions + totals (tokens, cost) + stale + optional messages

  2. `FILTER_LEVEL <workspace>`
     - Just check which filter level matches + which TAG

  3. `SHOW_DB_INFO`
     - DB path, size, mtime, session count, has_messages_table

  4. `STALE [days=30] [workspace]`
     - Find sessions older than N days (via julianday)

  5. `HELP`
     - Show docstring

  ## 3-Level Filter
  Level 1 (TAG):     `name LIKE '%' || <GOOSE_SESSION_TAG> || '%'`
  Level 2 (WD):      `working_dir LIKE <workspace> || '%'`
  Level 3 (FALLBACK): last N sessions WHERE recipe_json NOT LIKE '%DEV-MAS-ENGINEER%'

  ## Procedure ANALYZE_SESSIONS
  1. Run: `python3 {tools_dir}/dev_session_query.py ANALYZE {target_workspace} 20`
  2. Parse JSON output
  3. status='no_db': signal='DONE', warning 'No Session-DB found'
  4. status='no_sessions': signal='DONE', warning 'No Sessions for this project'
  5. status='db_locked': signal='DONE', warning 'DB copy failed'
  6. status='success': parse filter_level, sessions, totals, stale

  ## Procedure ANALYZE_WITH_MESSAGES (corrections, confusions, etc.)
  1. Run: `python3 {tools_dir}/dev_session_query.py ANALYZE {target_workspace} 20 --include-messages`
  2. Same as above + parse `messages` (corrections, confusions, praises, etc.)
  3. Only available if goose has 'messages' table (newer versions)

  ## Output
  ```yaml
  mas_result:
    signal: '🟢 DONE'
    request_id: string
    from: 'sub_mas-im-session-reader'
    to: 'dev-mas-engineer'
    status: 'success'
    parsed:
      task: 'ANALYZE|FILTER_LEVEL|SHOW_DB_INFO|STALE'
      tool: 'tools/dev_session_query.py'
      tool_exit: 0|1
      observations:
        - severity: 'P1'|'P2'|'P3'
          title: string
          description: string
  ```

  ## Edge Cases (per Coronashield)
  - DB not found        → status='no_db' (no abort)
  - DB locked           → try sqlite3 .clone, fallback cp
  - 0 sessions in all   → status='no_sessions' (no abort)
  - .goosehints missing → skip Level 1
  - include_messages + no messages-table → skip chat extraction

  ## Migration Note (R89 Phase 7)
  Before: sub-agent ran sqlite3 queries via LLM shell (slow, expensive, brittle).
  After: sub-agent invokes the deterministic tool. Same behavior, faster, reproducible,
  E2E-testable, $0 cost per call.

  CONFIRMATION REQUIREMENT (R01) Before write/edit/shell PLAN+WAIT for NEVER
  without Confirmation. MODE-DOMAIN COUPLING (R09) ONLY {target_workspace} — NO
  domain-overreach. Reading in other domain OK.

  ## SOT RULES (apply to ALL operations)
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R04 GENERAL-IMPROVER — NEVER edit general-improver.yaml (no recursion).
  ⛔ R09 DOMAIN — Stay within the target workspace. NO cross-domain writes.
  ⛔ R10 CORONASHIELD — Validate each YAML (dev_yaml_check.py) before storage.

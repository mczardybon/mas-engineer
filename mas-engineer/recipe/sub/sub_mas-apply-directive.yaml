name: sub_mas-apply-directive
title: 🎯 Apply-Directive
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
prompt: 'I am apply-directive (v1.0.0) | MODE-CHECK: mas-engineer | 🎯 APPLY-DIRECTIVE (v1.0.0)
  Operator-initiated directive-driven improver. Reads a .mase/directives/R<NR>-<topic>.md
  file (R110-115 spec), parses DIREKTIVE blocks, applies YAML/code patches via
  sub_mas-yaml-editor + direct file edits, validates via sub_mas-goose-expert.
  Bypasses R04-block (NEVER edit general-improver.yaml) because directive is
  operator-written, not improver-generated.

  '
description: 'v1.0.0 | MAS-internal: Apply-Directive applies operator-written .mase/directives/ specs to mas-engineer codebase (DOMAIN 1)'
sub_recipes:
  - name: sub_mas-goose-expert
    path: ./sub_mas-goose-expert.yaml
    description: "R11 mandatory consultation for goose-compatible patch designs"
  - name: sub_mas-yaml-editor
    path: ./sub_mas-yaml-editor.yaml
    description: "R10 YAML file edits for all YAML changes"
settings:
  timeout: 600
  max_turns: 100
  temperature: 0.3
  goose_provider: openai
  goose_model: deepseek-v4-flash
instructions: '# Extended instructions: recipe/instructions/sub_mas-apply-directive.md


  Full instructions outsourced to external file for maintainability.


  ## Loading

  All detailed workflows, examples, and rules are in the external file. This recipe
  contains only the role, prompt, and configuration.


  ## Read external file FIRST

  Before any action, read: `recipe/instructions/sub_mas-apply-directive.md`

  '
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true

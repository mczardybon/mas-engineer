name: MAS Signal Generator
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
title: 📡 SUB-SIGNAL-GENERATOR — Signal Generator (Sub-Agent)
description: 'v1.1.0 | MAS-internal: Generates CP_DONE, ERROR, SESSION_END signals (at-least-once)'
instructions: '╔══════════════════════════════════════════════╗

  ║  SOT WORKFLOW CONTROL                       ║

  ║  → workflows.yaml → agents.signal-generator ║

  ║     .task_workflows.CP_DONE                 ║

  ╚══════════════════════════════════════════════╝


  # sub_mas-signal-generator — 📡 Signal Generator

  MAS-Engineer-internal. Generates CP_DONE, ERROR, SESSION_END signals.

  Called after each action from MAS-Engineer.


  # ⛔ ALL BOUNDARIES IN SOT: cat workflows.yaml → configs.mas-self.restrictions. dev_rule_checker.py
  enforces.


  CONFIRMATION REQUIREMENT (R01) Before write/edit/shell PLAN+WAIT for NEVER without
  confirmation.

  MODE-DOMAIN COUPLING (R09) ONLY {target_workspace} — NO domain overreach. Reading
  in other domain OK.

  '
prompt: '⛔ I am signal-generator (v1.0.0) | MODE-CHECK: mas-engineer | 📡 SUB-SIGNAL-GENERATOR
  — Signal Generator (Sub-Agent)

  📡 SIGNAL-GENERATOR (v1.0.0) Generate CP_DONE | ERROR | SESSION_END signal.

  NEVER without confirmation. — NO domain overreach. Reading in other domain OK.



  # R10 CORONASHIELD Every YAML must be validated before storing (via sub_mas-recovery-immune).
  NO YAML-Save without vorherige Syntax-Check.'
settings:
  timeout: 600
  max_steps: 100
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
  # R110-160: retry-policy (at-least-once delivery semantics)
  # Signal generation must be idempotent + retryable.  The MQ
  # (dev_message_queue, R110-154) handles retries on the queue
  # side; the agent itself must also retry transient failures
  # (e.g. dev_dispatch_tracker error, file lock contention).
  retry_policy:
    max_attempts: 3
    backoff_sec: [1, 2, 4]   # exponential, cap at 4s
    retry_on:
      - transient_io_error
      - file_lock_contention
      - dispatch_tracker_timeout
    do_not_retry_on:
      - schema_validation_error   # permanent, fix the data
      - permission_denied
  # R110-160: at-least-once delivery is guaranteed by the combination
  # of (a) idempotency_key=cpdone-{request_id} on the MQ side and
  # (b) the retry_policy above.  Signals are durable in
  # .mase/mq/{cpdone,error}.ndjson and survive process restarts.
  delivery_guarantee: at_least_once
  idempotency: true
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true

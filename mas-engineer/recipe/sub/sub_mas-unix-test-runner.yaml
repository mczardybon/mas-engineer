name: MAS Unix Test Runner
version: 2.0.0  # R85: replaced inline logic with tools/dev_test_runner.py
constitution: sub_mas-master-constitution.yaml
title: 🔧 SUB-MAS-UNIX-TEST-RUNNER — POSIX `test` builtin regression-suite (Script-wrapper)
description: 'v2.0.0 | MAS-internal: Delegates to tools/dev_test_runner.py. File-system-level regression checks (POSIX test builtin).'
instructions: |
  # UNIX-TEST-RUNNER v2.0.0 (Script-wrapper)

  R85 REFACTOR: All logic moved to `tools/dev_test_runner.py`.
  This recipe wraps POSIX `test` builtin (`[ -f file ]`) checks for file-system
  integrity: missing recipe files, empty dirs, broken symlinks, non-executable
  scripts, wrong YAML extensions.

  ## ⛔ NOT detected by pytest — only by this runner.

  ## Usage
  Call `tools/dev_test_runner.py RUN <workspace> tests/test_unix_test_word.py`
  (the existing test file implements POSIX `test` checks via subprocess).
prompt: |
  I am unix-test-runner (v2.0.0) | MODE-CHECK: mas-engineer | 🔧 UNIX-TEST-RUNNER
  ⛔ File-system regression checks via tools/dev_test_runner.py.
  → POSIX `test` builtin (e.g., `[ -f file ]`, `test -d dir`).

settings:
  timeout: 300
  max_turns: 30
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true

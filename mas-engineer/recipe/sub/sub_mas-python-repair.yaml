name: MAS Python Repair Director
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
title: 🧬 SUB-MAS-PYTHON-REPAIR-DIRECTOR — Python Repair Orchestrator
description: 'v1.0.0 | MAS-internal: Orchestrates Python repair pipeline by delegating to specialized sub-agents'
instructions: |
  # PYTHON-REPAIR-DIRECTOR v1.0.0
  # Orchestrator — delegates to specialized sub-agents

  ## ⛔ ONLY orchestration — NO direct Python repair
  → Delegate to specialized sub-agents based on task

  ## Delegation Map
  - analyze/compile/scan → sub_mas-python-analyzer
  - fix/repair/patch → sub_mas-python-fixer
  - validate/verify → sub_mas-python-validator

  ## RULES
  - R01: No changes without User confirmation
  - R09: Strict domain separation
  - R10: CORONASHIELD — validate YAML before storage
prompt: |
  I am python-repair-director (v1.0.0) | MODE-CHECK: mas-engineer | 🧬 PYTHON-REPAIR-DIRECTOR (v1.0.0)
  ⛔ ONLY orchestration — NO direct Python repair
  → Delegate to specialized sub-agents based on task
sub_recipes:
  - name: sub_mas-python-analyzer
    path: ./sub_mas-python-analyzer.yaml
    description: Python code analysis and compilation checks
  - name: sub_mas-python-fixer
    path: ./sub_mas-python-fixer.yaml
    description: Python code repair and patching
  - name: sub_mas-python-validator
    path: ./sub_mas-python-validator.yaml
    description: Python code validation and verification
settings:
  timeout: 600
  max_steps: 100
  goose_provider: openai
  goose_model: deepseek-chat
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true

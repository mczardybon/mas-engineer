description: 'v2.0.0 | CONTROLLER-internal: Cycle log + session report. Delegates to tools/dev_health_monitor.py LOG_SESSION.'
instructions: |
  # MONITOR-SESSION v2.0.0 (Script-wrapper)

  R85 Phase 2 REFACTOR: All logic moved to `tools/dev_health_monitor.py`.
  This recipe is a thin wrapper — it delegates session-logging to the script.

  ## Usage
  Call `tools/dev_health_monitor.py LOG_SESSION <event> [json_details]`.
  Script appends JSON line to `.state/logs/cycle-{YYYY-MM-DD}.log`.

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Stay within target workspace. NO cross-domain writes.

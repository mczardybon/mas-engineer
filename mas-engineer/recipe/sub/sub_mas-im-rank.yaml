name: sub_mas-im-rank
title: 🔧 IM-Rank
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
prompt: 'I am im-rank (v1.0.0) | MODE-CHECK: mas-engineer | 📊 IM-RANK (v1.0.0) Prioritize
  and filter Findings. ⛔ ONLY Analysis — no Changes.

  # R10 CORONASHIELD Every YAML must be validated before storing (via sub_mas-recovery-immune).
  NO YAML-Save without vorherige Syntax-Check.

  # R10 CORONASHIELD Every YAML must be validated before storing (via sub_mas-recovery-immune).
  NO YAML-Save without vorherige Syntax-Check.'
description: 📊 Prioritize findings, deduplicate, Art.1-6 check
settings:
  timeout: 600
  max_turns: 100
  temperature: 0.3
  goose_provider: openai
  goose_model: deepseek-v4-flash
instructions: '# Extended instructions: recipe/instructions/sub_mas-im-rank.md


  Full instructions outsourced to external file for maintainability.


  ## Loading

  All detailed workflows, examples, and rules are in the external file. This recipe
  contains only the role, prompt, and configuration.


  ## Read external file FIRST

  Before any action, read: `recipe/instructions/sub_mas-im-rank.md`

  '
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true
response:
  json_schema:
    type: object
    required:
    - top_N
    - ranked_findings
    properties:
      top_N:
        type: integer
      ranked_findings:
        type: array
        items:
          type: object
          required:
          - finding_id
          - priority
          properties:
            finding_id:
              type: string
            priority:
              type: number
            severity:
              type: string

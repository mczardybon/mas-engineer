name: MAS Dashboard Collector
version: 2.0.0  # R85 Phase 3: thin wrapper — same as data-reader (collector = alias)
constitution: sub_mas-master-constitution.yaml
title: 📊 SUB-DASHBOARD-COLLECTOR — Dashboard Data Collection (Script-wrapper)
description: 'v2.0.0 | MAS-internal: Collects and validates dashboard data. Delegates to tools/dev_dashboard_data.py.'
instructions: |
  # DASHBOARD-COLLECTOR v2.0.0 (Script-wrapper)

  R85 Phase 3 REFACTOR: Existing script tools/dev_dashboard_data.py (~12k) does
  the actual work. This recipe is a thin wrapper (alias of data-reader) that calls
  the script directly.

  ## Usage
  Call: `python3 tools/dev_dashboard_data.py --workspace <path>`
  Output: {workspace}/.mase/dashboards/data.json

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Stay within target workspace.
  ⛔ R10 CORONASHIELD — YAML-validate output before storage.
prompt: |
  I am dashboard-collector (v2.0.0) | MODE-CHECK: mas-engineer | 📊 SUB-DASHBOARD-COLLECTOR (v2.0.0)

  ⛔ ONLY data collection — NO dashboard building.
  Delegate to: `python3 tools/dev_dashboard_data.py --workspace <path>`.
settings:
  timeout: 120
  max_turns: 30
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
  display_name: Summon (MCP)
  timeout: 60
  bundled: true
- type: builtin
  name: developer
  display_name: Developer
  timeout: 60
  bundled: true

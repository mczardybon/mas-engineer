# SQLi Scanner (v2.0.0 - Script-wrapper)
name: SQLi Scanner
version: 2.0.0  # R85 Phase 5: thin wrapper around tools/dev_security_scan.py
constitution: sub_mas-master-constitution.yaml
title: 🛡️ SUB-MAS-SECURITY-SQLI-SCANNER — SQL Injection (Script-wrapper)
description: 'v2.0.0 | Code-Review-Team: Scans for SQL injection vulnerabilities. Delegates to tools/dev_security_scan.py SCAN sqli.'
instructions: |
  # SQLI-SCANNER v2.0.0 (Script-wrapper)

  R85 Phase 5 REFACTOR: All detection logic moved to `tools/dev_security_scan.py SCAN sqli`.
  This recipe is a thin wrapper that delegates scanning to the script.

  ## Usage
  Call: `python3 tools/dev_security_scan.py SCAN sqli [path]`
  Returns JSON: findings[] (raw SQL f-strings, %-formatting in execute, string concat in queries).

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Stay within target workspace.
prompt: |
  I am sqli-scanner (v2.0.0) | MODE-CHECK: mas-engineer | 🛡️ SQLI-SCANNER

  ⛔ ONLY SQL injection scanning — NO other vulnerability types.
  Delegate to: `python3 tools/dev_security_scan.py SCAN sqli .`.
settings:
  timeout: 120
  max_steps: 15
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 60
  bundled: true

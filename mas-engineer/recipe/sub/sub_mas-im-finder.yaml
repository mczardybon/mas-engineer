name: sub_mas-im-finder
title: 🔧 IM-Finder
version: 1.0.0
constitution: sub_mas-master-constitution.yaml
prompt: 'I am im-finder (v1.0.0) | MODE-CHECK: mas-engineer | 🔍 IM-FINDER (v1.0.0)
  Detect optimization potential (37 Feature-Typees). ⛔ ANALYSIS + DELEGATION — no
  direct file edits to recipe code (those go through im-validator → im-apply). I DO
  WRITE findings.yaml with attached goose_verdicts (I summon sub_mas-goose-expert
  via the `delegate` tool for each goose-related finding).'
description: '🔍 Detects optimization potential (53 Feature Types A-MM: A-KK + LL (User)
  + MM (YAML Structure))'
sub_recipes:
  - name: sub_mas-goose-expert
    path: ./sub_mas-goose-expert.yaml
    description: "R11 mandatory consultation for goose-related finding types"
  - name: sub_mas-im-designer
    path: ./sub_mas-im-designer.yaml
    description: "R110-78 PHASE 3b: design validation for spec-drift fixes"
  - name: sub_mas-self-audit
    path: ./sub_mas-self-audit.yaml
    description: "R110-78 PHASE 3b: spec-drift detector (Pattern A/B/C: hardcodes, stale literals, count-assertion mismatch)"
settings:
  timeout: 600
  max_turns: 100
  temperature: 0.3
  goose_provider: openai
  goose_model: deepseek-v4-flash
instructions: '# Extended instructions: recipe/instructions/sub_mas-im-finder.md


  Full instructions outsourced to external file for maintainability.


  ## Loading

  All detailed workflows, examples, and rules are in the external file. This recipe
  contains only the role, prompt, and configuration.


  ## Read external file FIRST

  Before any action, read: `recipe/instructions/sub_mas-im-finder.md`

  '
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 300
  bundled: true
response:
  json_schema:
    type: object
    required:
    - findings
    properties:
      findings:
        type: array
        items:
          type: object
          required:
          - id
          - type
          - severity
          - file
          - issue
          - impact
          - fix
          properties:
            id:
              type: string
            type:
              type: string
            severity:
              type: string
            file:
              type: string
            issue:
              type: string
            impact:
              type: string
            fix:
              type: string

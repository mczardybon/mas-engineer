name: MAS Monitor Recovery
version: 2.0.0  # R85 Phase 2: replaced inline logic with tools/dev_health_monitor.py
constitution: sub_mas-master-constitution.yaml
title: 🚑 FW-MONITOR-RECOVERY — Agent Recovery (Script-wrapper)
description: 'v2.0.0 | CONTROLLER-internal: Restart dead/looping agents, max 3 attempts. Delegates to tools/dev_health_monitor.py RECOVER.'
instructions: |
  # MONITOR-RECOVERY v2.0.0 (Script-wrapper)

  R85 Phase 2 REFACTOR: All logic moved to `tools/dev_health_monitor.py`.
  This recipe is a thin wrapper — it delegates agent-recovery to the script.

  ## Usage
  Call `tools/dev_health_monitor.py RECOVER <agent> [attempt] [max_attempts]`.
  Default attempt=1, max_attempts=3. After max: signal ESCALATE.

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R04 GENERAL-IMPROVER — NEVER edit general-improver.yaml (no recursion).
  ⛔ R09 DOMAIN — Stay within target workspace.
prompt: |
  I am monitor-recovery (v2.0.0) | MODE-CHECK: mas-engineer | 🚑 FW-MONITOR-RECOVERY
  ⛔ ONLY Recovery-Action — NO schema edits. Use tools/dev_health_monitor.py RECOVER.
settings:
  timeout: 180
  max_turns: 25
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 60
  bundled: true

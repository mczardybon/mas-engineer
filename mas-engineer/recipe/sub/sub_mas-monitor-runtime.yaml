name: MAS Monitor Runtime
version: 2.0.0  # R85 Phase 2: replaced inline logic with tools/dev_health_monitor.py
constitution: sub_mas-master-constitution.yaml
title: 🔍 FW-MONITOR-RUNTIME — Active Session Check (Script-wrapper)
description: 'v2.0.0 | CONTROLLER-internal: Detects active/stale sessions, crashes, arch violations. Delegates to tools/dev_health_monitor.py CHECK_RUNTIME.'
instructions: |
  # MONITOR-RUNTIME v2.0.0 (Script-wrapper)

  R85 Phase 2 REFACTOR: All logic moved to `tools/dev_health_monitor.py`.
  This recipe is a thin wrapper — it delegates runtime-checks to the script.

  ## Usage
  Call `tools/dev_health_monitor.py CHECK_RUNTIME [state_dir]`.
  Returns JSON: active_sessions, stale_sessions, crashes, arch_violations, signal.

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Read-only check within target workspace.
prompt: |
  I am monitor-runtime (v2.0.0) | MODE-CHECK: mas-engineer | 🔍 FW-MONITOR-RUNTIME
  ⛔ ONLY Runtime-Check — NO changes. Use tools/dev_health_monitor.py CHECK_RUNTIME.
settings:
  timeout: 120
  max_turns: 40
  goose_provider: openai
  goose_model: deepseek-v4-flash
  temperature: 0.3
extensions:
- type: platform
  name: summon
- type: builtin
  name: developer
  display_name: Developer
  timeout: 60
  bundled: true

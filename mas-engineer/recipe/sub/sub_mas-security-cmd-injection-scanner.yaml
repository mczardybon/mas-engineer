instructions: |
  # CMD-INJECTION-SCANNER v2.0.0 (Script-wrapper)

  R85 Phase 5 REFACTOR: All detection logic moved to `tools/dev_security_scan.py SCAN cmd-injection`.
  This recipe is a thin wrapper that delegates scanning to the script.

  ## Usage
  Call: `python3 tools/dev_security_scan.py SCAN cmd-injection [path]`
  Returns JSON: findings[] (os.system, subprocess shell=True, eval/exec on untrusted input).

  ## SOT RULES
  ⛔ R01 CONFIRMATION — Before write/edit/shell PLAN+WAIT on user ✅.
  ⛔ R09 DOMAIN — Stay within target workspace.

# =============================================================================
#  ci-e2e-smoke.yml — Run scripts/e2e-test.sh on push to mas-t (and PRs)
#
#  Scope: recipe/sub YAML parse + agent smoke + workflow smoke
#         (the 11-check shell harness, R110-60 regression baseline).
#  Cadence: every push to mas-t + every PR; ~3min timeout.
#  Compat: respects block-copilot.yml; uses DEEPSEEK_API_KEY from secrets
#         only when the optional goose-step is enabled.
#  Cost:   ~1-2 min per run, no external API costs (no goose step in default
#         matrix — goose runs locally, CI only does the shell harness).
#  Notify: Discord webhook on failure, no-op if DISCORD_WEBHOOK_URL
#         secret is absent.
# =============================================================================

name: 🚬 ci-e2e-smoke (shell harness)

on:
  push:
    branches: ["mas-t"]
  pull_request:
    branches: ["mas-t"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-shell:
    name: e2e-test.sh (11 checks)
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    timeout-minutes: 5

    env:
      # Empty DEEPSEEK_API_KEY → e2e-test.sh skips the optional goose step
      # (R110-224 lesson: missing key caused 200s timeout; we explicitly
      # skip that step in CI to keep this workflow fast + cost-free).
      DEEPSEEK_API_KEY: ""
      GH_PAT: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip intentionally OFF. mas-engineer has no
          # requirements.txt/pyproject.toml. See ci-tests.yml for
          # the full rationale. (R110-241)

      - name: Install minimal deps for e2e shell harness
        working-directory: mas-engineer
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run e2e-test.sh
        working-directory: mas-engineer
        run: |
          bash scripts/e2e-test.sh 2>&1 | tee e2e-smoke.log
          # The harness prints "Safe to push" on success. Fail otherwise.
          grep -q "Safe to push" e2e-smoke.log \
            || (echo "::error::e2e harness did not return 'Safe to push'" \
                && exit 1)

      - name: Upload e2e log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-failure
          path: e2e-smoke.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_URL not set; skipping notification."
            exit 0
          fi
          curl -fsS -X POST "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            --data @- <<EOF
          {
            "content": ":x: **ci-e2e-smoke** failed on \`${{ github.ref_name }}\` — run <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.run_id }}>\nActor: ${{ github.actor }}\nCommit: ${{ github.sha }}"
          }
          EOF

# =============================================================================
#  ci-quality.yml — Security + dependency audit + container fs scan
#
#  Scope: bandit (Python SAST) + pip-audit (dep vulns) + trivy (fs scan).
#         Findings are uploaded as SARIF to GitHub Code Scanning (free,
#         no extra account, no external cost).
#  Cadence: every push to mas-t + every PR (fast jobs, ~1-2min total)
#           + weekly Monday 06:00 UTC for fresh dep DB.
#  Compat:  respects block-copilot.yml + ai-pipeline-kill-switch.yml
#           (early-exit when actor is github-actions[bot] or repo is
#           in a kill switch state).
#  Cost:    ~$0. All tools free for OSS. SARIF uses native Code Scanning.
#  Secrets: none required.
#  Why NEW workflow: keeps ci-tests.yml focused on pytest, keeps ci-e2e-
#         smoke focused on shell harness, isolates security/audit so a
#         flaky dep DB update does not block the test signal.
# =============================================================================

name: 🔒 ci-quality (security + audit)

on:
  push:
    branches: ["mas-t"]
  pull_request:
    branches: ["mas-t"]
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC. Captures new CVEs in the dep DB without
    # spamming every commit. pip-audit's OSV DB updates several times
    # per day; a weekly cadence is enough for a small OSS Python project.
    - cron: "0 6 * * 1"

permissions:
  # contents: read for checkout; security-events: write for SARIF
  # upload to GitHub Code Scanning. No other scopes.
  contents: read
  security-events: write

# Cancel superseded runs on the same PR/branch.
concurrency:
  group: ci-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: bandit (Python SAST) + pip-audit (dependency vulnerabilities).
  # Combined into one job because both are pip-installable + fast (~30s).
  # ---------------------------------------------------------------------------
  python-audit:
    name: bandit + pip-audit
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip intentionally OFF. mas-engineer has no
          # requirements.txt/pyproject.toml. See ci-tests.yml for
          # the full rationale. (R110-241)

      - name: Install bandit + pip-audit
        working-directory: mas-engineer
        run: |
          python -m pip install --upgrade pip
          # bandit = Python code SAST (PyCQA). pip-audit = PyPA official
          # dep vulnerability scanner (replaces PyUp safety, which was
          # deprecated January 2024). Both query public OSV / PyPA
          # Advisory DB, no API token required.
          pip install bandit pip-audit

      - name: Bandit (Python SAST)
        working-directory: mas-engineer
        # -ll = only medium+high severity. -ii = only high+medium confidence.
        # This filters out the noisy "assert_used" / "blacklist" findings
        # that bandit emits by default and which would drown the signal.
        # Adjust thresholds as the codebase grows; start conservative.
        # `|| true` so a finding does not hard-fail the run — it becomes
        # a SARIF alert that shows up in the Security tab. Remove `|| true`
        # when you want bandit to gate PRs.
        run: |
          mkdir -p .ci-artifacts
          bandit -r tools scripts tests recipe \
                 -ll -ii \
                 --exclude '.ci-artifacts,.git,.mase,logs' \
                 -f sarif -o .ci-artifacts/bandit.sarif \
                 || true
          # Always produce a human-readable summary for the run log.
          bandit -r tools scripts tests recipe \
                 -ll -ii \
                 --exclude '.ci-artifacts,.git,.mase,logs' \
                 -f txt 2>&1 | tail -30 || true

      - name: Upload Bandit SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci-artifacts/bandit.sarif
          category: bandit

      - name: pip-audit (dependency vulnerabilities)
        # --strict: exit non-zero on unfixable vulns. We capture that and
        # upload as SARIF; the workflow itself stays green so other
        # signals (pytest, e2e) still surface. Drop --strict to make
        # findings non-blocking.
        # --no-deps: skip transitive deps. mas-engineer has a flat test
        # dependency set (pytest, pyyaml, jsonschema, bandit, pip-audit)
        # which we list explicitly here.
        run: |
          # Generate a frozen requirements list of everything installed
          # in this job's venv. pip-audit reads this and queries the
          # OSV API. No requirements.txt needed in the repo.
          pip freeze > /tmp/requirements-frozen.txt
          pip-audit --strict --requirement /tmp/requirements-frozen.txt \
                    --format json --output /tmp/pip-audit.json \
                    || AUDIT_EXIT=$?
          # Normalize the pip-audit JSON to SARIF for Code Scanning.
          python3 - <<'PY' || true
          import json, sys, datetime
          try:
              with open("/tmp/pip-audit.json") as f:
                  findings = json.load(f)
          except Exception:
              findings = {"dependencies": []}
          sarif = {
              "version": "2.1.0",
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "pip-audit",
                          "version": "n/a",
                          "informationUri": "https://pypi.org/project/pip-audit/",
                          "rules": [],
                      }
                  },
                  "results": [],
              }],
          }
          for dep in findings.get("dependencies", []):
              for v in dep.get("vulns", []):
                  rid = v.get("id", "UNKNOWN")
                  sarif["runs"][0]["results"].append({
                      "ruleId": rid,
                      "level": "error",
                      "message": {"text": f"{dep['name']} {dep['version']}: {v.get('description', rid)}"},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": "requirements-frozen.txt"}
                          }
                      }],
                  })
          with open(".ci-artifacts/pip-audit.sarif", "w") as f:
              json.dump(sarif, f)
          print(f"pip-audit: {len(sarif['runs'][0]['results'])} findings")
          PY

      - name: Upload pip-audit SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci-artifacts/pip-audit.sarif
          category: pip-audit

  # ---------------------------------------------------------------------------
  # Job 2: trivy (filesystem + IaC + secret scan). Separate from python-audit
  # because trivy ships as an OCI container, no pip install, and scans things
  # bandit cannot (yaml, json, shell, Dockerfile, .github/workflows/).
  # ---------------------------------------------------------------------------
  trivy-fs:
    name: trivy fs scan
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .

      - name: Trivy filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          # Only HIGH and CRITICAL — LOW/MEDIUM trivy fs noise dwarfs
          # signal for a Python-only repo. Tighten to CRITICAL only
          # for stricter gating.
          severity: HIGH,CRITICAL
          # Do not fail the workflow on findings; the SARIF upload
          # surfaces them in the Security tab. Set to '1' to make
          # the job gate PRs.
          exit-code: "0"
          format: sarif
          output: .ci-artifacts/trivy-fs.sarif
          # Skip scanning .git, the persistent evidence archive, and
          # any vendored deps to keep the scan fast and focused.
          ignorefile: .trivyignore

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .ci-artifacts/trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # Job 3: aggregate "any security findings?" check + summary. Runs after both
  # audit jobs. Does not gate the workflow (findings already surface in
  # Code Scanning). Provides a single human-readable line in the run log.
  # ---------------------------------------------------------------------------
  summary:
    name: security summary
    runs-on: ubuntu-latest
    if: always() && github.actor != 'github-actions[bot]'
    needs: [python-audit, trivy-fs]
    timeout-minutes: 2

    steps:
      - name: Print summary
        run: |
          echo "## Security audit summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- bandit (Python SAST): see Security tab → Code Scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "- pip-audit (dep vulns): see Security tab → Code Scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "- trivy (fs scan): see Security tab → Code Scanning" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Findings are non-blocking in this workflow by design." >> "$GITHUB_STEP_SUMMARY"
          echo "To gate on findings, set exit-code: '1' on the relevant step." >> "$GITHUB_STEP_SUMMARY"

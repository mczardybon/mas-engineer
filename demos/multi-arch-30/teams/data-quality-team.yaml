# TEAM 3: data-quality-team [PIPELINE]
# 5 sequential stages: profile → validate → anomalies → enrich → report
name: data-quality-team
title: "Data quality team — 5 sequential pipeline stages (PIPELINE)"
description: "Data quality team — 5 sequential pipeline stages (PIPELINE)"
version: 1.0.0

sub_recipes:
  - name: dq-stage-1-profile
    path: ../sub/dq-stage-1-profile.yaml
    description: "Stage 1 — Profile: rows, columns, types, missing %"
  - name: dq-stage-2-validate
    path: ../sub/dq-stage-2-validate.yaml
    description: "Stage 2 — Validate: schema/types/range checks"
  - name: dq-stage-3-anomalies
    path: ../sub/dq-stage-3-anomalies.yaml
    description: "Stage 3 — Anomalies: outliers, duplicates, drift"
  - name: dq-stage-4-enrich
    path: ../sub/dq-stage-4-enrich.yaml
    description: "Stage 4 — Enrich: imputation, dedup suggestions"
  - name: dq-stage-5-report
    path: ../sub/dq-stage-5-report.yaml
    description: "Stage 5 — Report: score 0-100, findings"

instructions: |
  This is the data quality team (PIPELINE architecture).
  Data flows through 5 sequential stages:
    Stage 1: Profile (rows, columns, types, missing %)
    Stage 2: Validate (schema, range, format checks)
    Stage 3: Anomalies (outliers, duplicates, drift)
    Stage 4: Enrich (imputation, dedup suggestions)
    Stage 5: Report (score 0-100, findings, recommendations)
  Use for: data quality assessment, profiling, cleaning recommendations.

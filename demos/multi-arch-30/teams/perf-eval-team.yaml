# TEAM 4: perf-eval-team [HIERARCHICAL]
# Lead delegates to 4 specialists, aggregates, makes final call
name: perf-eval-team
title: "Performance evaluation team — 1 lead + 4 specialists (HIERARCHICAL)"
description: "Performance evaluation team — 1 lead + 4 specialists (HIERARCHICAL)"
version: 1.0.0

sub_recipes:
  - name: perf-eval-lead
    path: ../sub/perf-eval-lead.yaml
    description: "Team lead — delegates to 4 specialists"
  - name: perf-eval-cpu
    path: ../sub/perf-eval-cpu.yaml
    description: "CPU performance specialist — hot functions, algorithmic"
  - name: perf-eval-memory
    path: ../sub/perf-eval-memory.yaml
    description: "Memory specialist — allocations, leaks, GC"
  - name: perf-eval-io
    path: ../sub/perf-eval-io.yaml
    description: "I/O specialist — disk, network, serialization"
  - name: perf-eval-concurrency
    path: ../sub/perf-eval-concurrency.yaml
    description: "Concurrency specialist — locks, contention, races"

instructions: |
  This is the performance evaluation team (HIERARCHICAL architecture).
  The lead delegates profiling tasks to 4 specialists and aggregates results.
  Specialists: CPU, memory, I/O, concurrency.
  Use for: performance profiling, bottleneck analysis, optimization suggestions.

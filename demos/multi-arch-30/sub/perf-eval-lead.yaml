# TEAM 4: perf-eval-team [HIERARCHICAL] — LEAD
# Receives task, delegates to 4 specialists, aggregates results
name: perf-eval-lead
title: "perf-eval-lead — Team Lead for Performance Evaluation (HIERARCHICAL)"
description: "Lead performance evaluator — delegates to 4 specialists and aggregates findings"
version: 1.0.0
role: lead

sub_recipes:
  - name: perf-eval-cpu
    path: ./perf-eval-cpu.yaml
    description: "CPU specialist"
  - name: perf-eval-memory
    path: ./perf-eval-memory.yaml
    description: "Memory specialist"
  - name: perf-eval-io
    path: ./perf-eval-io.yaml
    description: "I/O specialist"
  - name: perf-eval-concurrency
    path: ./perf-eval-concurrency.yaml
    description: "Concurrency specialist"

instructions: |
  You are the performance evaluation lead. You:
  1. Parse the performance profiling task
  2. Delegate to 4 specialists (CPU, memory, I/O, concurrency)
  3. Collect and merge findings
  4. Prioritize performance bottlenecks
  5. Produce a final performance report with actionable optimizations
  Use delegate() to call each specialist, then synthesize results.
